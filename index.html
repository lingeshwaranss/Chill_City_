<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHILL CITY - Civic Issue Reporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      /* Custom Scrollbar for Light Theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F4F7F6; 
      }
      ::-webkit-scrollbar-thumb {
        background: #ccc; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1B3B6F; 
      }
      
      /* Leaflet Overrides for Light Theme */
      .leaflet-container {
        background: #F4F7F6;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: #FFFFFF;
        color: #1B3B6F;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        border-radius: 0.5rem;
      }
      .leaflet-bar a {
        background-color: #FFFFFF;
        color: #1B3B6F;
        border-bottom: 1px solid #e5e7eb;
      }
      .leaflet-bar a:hover {
        background-color: #f3f4f6;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#F4F7F6', // Light Gray
              surface: '#FFFFFF',    // White
              primary: '#1B3B6F',    // Deep Navy Blue
              accent: '#FDB813',     // Golden Yellow
              secondary: '#6C757D',
              success: '#28A745',
              warning: '#FFC107',
              danger: '#DC3545',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^6.22.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.344.0",
    "react-leaflet": "https://esm.sh/react-leaflet@^4.2.1",
    "leaflet/": "https://esm.sh/leaflet@^1.9.4/",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "jspdf": "https://esm.sh/jspdf@2.5.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
